# What a server runs: the built backend and the built UI. No source is mounted and
# no dev server runs, so nothing here compiles code on request.
#
# Never expose the Vite dev server (`yarn dev --host`) to a network you do not
# trust: it compiles whatever a request names, and GHSA-p4f5-76q4-ffq7 turned that
# into remote code execution. That is how this emulator's UI was attacked in
# November 2026. For hot reload on your own machine, use docker-compose.dev.yml,
# which only listens on 127.0.0.1.
services:
  backend:
    build:
      context: ./back_end
      target: production
    container_name: ocpp-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      SQLITE_PATH: /app/data/emulator.sqlite
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    volumes:
      # The SQLite file: chargers, cars and history survive a rebuild.
      - ocpp_data:/app/data

  ui:
    build:
      context: ./UI
      target: production
    container_name: ocpp-ui
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # `vite preview` serves the static build and forwards /api and /socket.io
      # here. It does not compile anything, so it is not exposed to the dev
      # server's attack surface.
      BACKEND_URL: http://backend:3000
      # Empty = the UI may be opened by any host name.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    ports:
      - '${UI_PORT:-5173}:5173'

volumes:
  ocpp_data:
