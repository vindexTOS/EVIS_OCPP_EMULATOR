services:
  backend:
    build:
      context: ./back_end
      target: development
    container_name: ocpp-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      SQLITE_PATH: /app/data/emulator.sqlite
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    volumes:
      # Bind-mount source for hot reload, but keep the container's node_modules.
      - ./back_end:/app
      - /app/node_modules
      # The SQLite file: chargers, cars and history survive a rebuild.
      - ocpp_data:/app/data

  ui:
    build:
      context: ./UI
      target: development
    container_name: ocpp-ui
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${UI_PORT:-5173}:5173'
    volumes:
      # Bind-mount source for hot reload, but keep the container's node_modules.
      - ./UI:/app
      - /app/node_modules

volumes:
  ocpp_data:
